name: Build and Test

on:
  push:
    branches: [ master, main, gtnh ]
  pull_request:
    branches: [ master, main, gtnh ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle wrapper
        run: |
          DIST_DIR="$HOME/.gradle/wrapper/dists/gradle-9.7.1-bin/1w1c7tv4s851m17nbqdsro2tv"
          mkdir -p "$DIST_DIR"
          curl -L -sS "https://github.com/gradle/gradle-distributions/releases/download/v9.7.1/gradle-9.7.1-bin.zip" -o "$DIST_DIR/gradle-9.7.1-bin.zip"
          unzip -q -o "$DIST_DIR/gradle-9.7.1-bin.zip" -d "$DIST_DIR"
          touch "$DIST_DIR/gradle-9.7.1-bin.zip.ok"

      - name: Test Nexus connectivity
        run: |
          echo "Testing curl to GTNH Nexus..."
          curl -I -sS -v "https://nexus.gtnewhorizons.com/repository/public/" || true
          curl -I -sS -v "https://nexus.gtnewhorizons.com/repository/public/com/gtnewhorizons/gtnhsettingsconvention/com.gtnewhorizons.gtnhsettingsconvention.gradle.plugin/2.0.33/com.gtnewhorizons.gtnhsettingsconvention.gradle.plugin-2.0.33.pom" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --info --stacktrace --no-daemon
